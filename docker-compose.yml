services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - srebuddy-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    networks:
      - srebuddy-network
    container_name: ollama-pull
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
    entrypoint: ["ollama", "pull", "${MODEL_NAME}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: images/api/Dockerfile
    container_name: srebuddy-api
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - MODEL_NAME=${MODEL_NAME}
    networks:
      - srebuddy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: images/ui/Dockerfile
    container_name: srebuddy-ui
    ports:
      - "${UI_PORT}:80"
    networks:
      - srebuddy-network
    depends_on:
      api:
        condition: service_healthy

networks:
  srebuddy-network:
    driver: bridge

volumes:
  ollama_models:
